<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strike 5×5</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #eee; user-select: none; }
  canvas { display: block; cursor: crosshair; }
  #lobby { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #2a3140, #0d0f13); z-index: 10; }
  .card { width: min(420px, 92vw); padding: 32px; background: #1a1e26; border: 1px solid #2c3340; border-radius: 14px; box-shadow: 0 20px 60px #0008; }
  h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: 1px; }
  h1 span { color: #4ea1ff; } h1 b { color: #ff5a5a; }
  .sub { color: #8b93a3; margin-bottom: 22px; }
  input { width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 8px; border: 1px solid #39414f; background: #0f1218; color: #fff; outline: none; }
  input:focus { border-color: #4ea1ff; }
  button { margin-top: 12px; width: 100%; padding: 12px; font-size: 17px; font-weight: 600; border: 0; border-radius: 8px; background: #4ea1ff; color: #08111f; cursor: pointer; }
  button:hover { background: #6fb3ff; }
  .help { margin-top: 18px; font-size: 13px; color: #8b93a3; line-height: 1.7; }
  kbd { background: #2a303c; border-radius: 4px; padding: 1px 6px; color: #ddd; font-family: inherit; }
  #status { margin-top: 10px; color: #ffb86b; font-size: 14px; min-height: 18px; }
</style>
</head>
<body>
<div id="lobby">
  <div class="card">
    <h1><span>STRIKE</span> 5<b>×</b>5</h1>
    <div class="sub">Командный бой: синие против красных. Свободные места занимают боты.</div>
    <input id="name" maxlength="16" placeholder="Твой ник" autocomplete="off">
    <button id="play">Играть</button>
    <div id="status"></div>
    <div class="help">
      <kbd>W A S D</kbd> движение &nbsp; <kbd>Мышь</kbd> прицел<br>
      <kbd>ЛКМ</kbd> стрельба &nbsp; <kbd>R</kbd> перезарядка &nbsp; <kbd>Tab</kbd> счёт<br>
      Карты: Склад, Пустыня, Город — меняются после каждого матча.<br>
      Матч до 50 убийств или 5 минут.
    </div>
  </div>
</div>
<canvas id="c"></canvas>
<script src="shared.js"></script>
<script>
(() => {
const { C, MAPS, move, keyDir } = Shared;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const lobby = document.getElementById('lobby');
const nameIn = document.getElementById('name');
const statusEl = document.getElementById('status');
const TEAM_COL = ['#4ea1ff', '#ff5a5a'];
const TEAM_NAME = ['Синие', 'Красные'];

let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
addEventListener('resize', resize); resize();

nameIn.value = localStorage.getItem('nick') || '';
let ws = null, myId = 0, mapIndex = 0, joined = false;
let snaps = [];            // буфер снапшотов для интерполяции
let last = null;           // последний снапшот
let roster = new Map();    // id -> {name, team, kills, deaths, bot}
let me = { x: 0, y: 0, rx: 0, ry: 0, alive: false, hp: 100, team: 0 };
let pending = [], seq = 0;
let tracers = [], feed = [], floaters = [];
let ping = 0, hurtFlash = 0, lastHp = 100;
const keys = {}; let mouse = { x: 0, y: 0, down: false }; let reloadReq = false; let showBoard = false;

// ---------- звук ----------
let actx = null;
function sfx(vol, freq, dur, noise) {
  if (!actx) return;
  const t = actx.currentTime;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); g.connect(actx.destination);
  if (noise) {
    const len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = actx.createBufferSource(); src.buffer = buf;
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    src.connect(f); f.connect(g); src.start(t);
  } else {
    const o = actx.createOscillator(); o.frequency.value = freq; o.connect(g); o.start(t); o.stop(t + dur);
  }
}

// ---------- сеть ----------
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  statusEl.textContent = 'Подключение…';
  ws.onopen = () => { ws.send(JSON.stringify({ t: 'join', name: nameIn.value || 'Игрок' })); };
  ws.onclose = () => { joined = false; lobby.style.display = 'flex'; statusEl.textContent = 'Соединение потеряно. Нажми «Играть», чтобы зайти снова.'; };
  ws.onerror = () => { statusEl.textContent = 'Не удалось подключиться к серверу.'; };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'welcome') { myId = m.id; mapIndex = m.m; joined = true; lobby.style.display = 'none'; snaps = []; pending = []; }
    else if (m.t === 'map') { mapIndex = m.m; snaps = []; pending = []; feed.push({ s: 'Карта: ' + MAPS[mapIndex].name, c: '#ffd166', t: performance.now() }); }
    else if (m.t === 'pong') { ping = Math.round(performance.now() - m.c); }
    else if (m.t === 's') onSnap(m);
  };
}
setInterval(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'ping', c: performance.now() })); }, 2000);

function onSnap(m) {
  const now = performance.now();
  if (m.r) { roster = new Map(m.r.map((r) => [r[0], { name: r[1], team: r[2], kills: r[3], deaths: r[4], bot: r[5] }])); }
  const players = new Map();
  for (const p of m.p) players.set(p[0], { id: p[0], team: p[1], x: p[2], y: p[3], a: p[4], hp: p[5], alive: p[6], bot: p[7] });
  snaps.push({ t: now, players }); if (snaps.length > 30) snaps.shift();
  last = m;
  // свой игрок: серверная позиция + повтор неподтверждённых вводов
  const sp = players.get(myId);
  if (sp) {
    me.team = sp.team; me.hp = sp.hp;
    if (sp.hp < lastHp && sp.alive) hurtFlash = 1;
    lastHp = sp.hp;
    if (!sp.alive) { me.alive = false; me.x = me.rx = sp.x; me.y = me.ry = sp.y; pending = []; }
    else {
      const wasDead = !me.alive;
      me.alive = true;
      pending = pending.filter((i) => i.s > m.me.seq);
      let x = sp.x, y = sp.y;
      for (const i of pending) { const [mx, my] = keyDir(i.k); if (mx || my) { const r = move(MAPS[mapIndex], x, y, mx * C.SPEED * C.DT, my * C.SPEED * C.DT, C.R); x = r.x; y = r.y; } }
      me.x = x; me.y = y;
      if (wasDead || Math.hypot(me.rx - x, me.ry - y) > 80) { me.rx = x; me.ry = y; }
    }
  }
  me.info = m.me;
  for (const s of m.sh) {
    tracers.push({ x1: s[0], y1: s[1], x2: s[2], y2: s[3], team: s[4], hit: s[5], t: now });
    const d = Math.hypot(s[0] - me.rx, s[1] - me.ry);
    if (d < 1400) sfx(0.18 * (1 - d / 1400) + 0.02, 1800, 0.09, true);
  }
  for (const ev of m.ev) {
    if (ev.t === 'kill') {
      feed.push({ kill: ev, t: now });
      if (ev.k === myId) { floaters.push({ s: '+1  ' + ev.vn, t: now }); sfx(0.15, 880, 0.12); }
    } else if (ev.t === 'msg') feed.push({ s: ev.s, c: '#9aa3b2', t: now });
  }
  if (feed.length > 6) feed.splice(0, feed.length - 6);
}

// ---------- ввод ----------
const KEYMAP = { KeyW: 1, ArrowUp: 1, KeyS: 2, ArrowDown: 2, KeyA: 4, ArrowLeft: 4, KeyD: 8, ArrowRight: 8 };
addEventListener('keydown', (e) => {
  if (!joined) return;
  if (e.code === 'Tab') { e.preventDefault(); showBoard = true; }
  if (e.code === 'KeyR') reloadReq = true;
  keys[e.code] = true;
});
addEventListener('keyup', (e) => { keys[e.code] = false; if (e.code === 'Tab') { e.preventDefault(); showBoard = false; } });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });
cv.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('mousedown', (e) => { if (e.button === 0) mouse.down = true; });
addEventListener('mouseup', (e) => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', (e) => e.preventDefault());

function aimAngle() { return Math.atan2(mouse.y - H / 2, mouse.x - W / 2); }

setInterval(() => {
  if (!joined || !ws || ws.readyState !== 1) return;
  let k = 0; for (const c in KEYMAP) if (keys[c]) k |= KEYMAP[c];
  const playing = last && last.st === 'play';
  const inp = { t: 'in', s: ++seq, k: playing ? k : 0, a: Math.round(aimAngle() * 1000) / 1000, f: mouse.down && playing ? 1 : 0, r: reloadReq ? 1 : 0 };
  reloadReq = false;
  ws.send(JSON.stringify(inp));
  if (me.alive && playing) {
    pending.push(inp);
    const [mx, my] = keyDir(inp.k);
    if (mx || my) { const r = move(MAPS[mapIndex], me.x, me.y, mx * C.SPEED * C.DT, my * C.SPEED * C.DT, C.R); me.x = r.x; me.y = r.y; }
  }
}, 1000 / C.TICK);

document.getElementById('play').onclick = start;
nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); });
function start() {
  localStorage.setItem('nick', nameIn.value);
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  if (ws && ws.readyState <= 1) ws.close();
  connect();
}

// ---------- отрисовка ----------
let mapCache = null, mapCacheIdx = -1;
function buildMapCache() {
  const map = MAPS[mapIndex], T = C.TILE, th = map.theme;
  const c = document.createElement('canvas'); c.width = map.pw; c.height = map.ph;
  const g = c.getContext('2d');
  for (let y = 0; y < map.H; y++) for (let x = 0; x < map.W; x++) {
    const wall = map.grid[y * map.W + x];
    if (wall) {
      g.fillStyle = th.wall; g.fillRect(x * T, y * T, T, T);
      g.fillStyle = th.wallTop; g.fillRect(x * T + 3, y * T + 3, T - 6, T - 10);
    } else {
      g.fillStyle = (x + y) % 2 ? th.floor : th.floor2; g.fillRect(x * T, y * T, T, T);
    }
  }
  for (const [team, col] of [['A', TEAM_COL[0]], ['B', TEAM_COL[1]]]) {
    g.fillStyle = col + '22';
    for (const [x, y] of map.spawns[team]) g.fillRect(x * T, y * T, T, T);
  }
  mapCache = c; mapCacheIdx = mapIndex;
}

function lerpAng(a, b, t) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * t; }

function interpPlayers(now) {
  const rt = now - 100;
  if (!snaps.length) return [];
  let a = snaps[0], b = snaps[snaps.length - 1];
  for (let i = snaps.length - 1; i > 0; i--) if (snaps[i - 1].t <= rt) { a = snaps[i - 1]; b = snaps[i]; break; }
  const t = b.t === a.t ? 1 : Math.max(0, Math.min(1, (rt - a.t) / (b.t - a.t)));
  const out = [];
  for (const [id, pb] of b.players) {
    const pa = a.players.get(id) || pb;
    const jump = Math.hypot(pb.x - pa.x, pb.y - pa.y) > 120;
    out.push({ ...pb, x: jump ? pb.x : pa.x + (pb.x - pa.x) * t, y: jump ? pb.y : pa.y + (pb.y - pa.y) * t, a: lerpAng(pa.a, pb.a, t) });
  }
  return out;
}

function drawPlayer(p, isMe) {
  const col = TEAM_COL[p.team];
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(2, 4, C.R, C.R * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(p.a);
  ctx.fillStyle = '#222'; ctx.fillRect(4, -3, C.R + 12, 6);
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, C.R, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = isMe ? 3 : 2; ctx.strokeStyle = isMe ? '#fff' : 'rgba(0,0,0,0.5)'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(4, -4, 4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // ник и hp
  const info = roster.get(p.id);
  ctx.font = '12px system-ui'; ctx.textAlign = 'center';
  ctx.fillStyle = isMe ? '#fff' : '#dfe3ea';
  ctx.fillText(info ? info.name : '', p.x, p.y - C.R - 12);
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(p.x - 18, p.y - C.R - 9, 36, 5);
  ctx.fillStyle = p.hp > 50 ? '#5fd35f' : p.hp > 25 ? '#ffc94d' : '#ff5a5a'; ctx.fillRect(p.x - 18, p.y - C.R - 9, 36 * p.hp / 100, 5);
}

function fmtTime(ms) { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const map = MAPS[mapIndex];
  ctx.fillStyle = map.theme.bg; ctx.fillRect(0, 0, W, H);
  if (!joined || !last) return;
  if (mapCacheIdx !== mapIndex) buildMapCache();

  // сглаживание своей позиции
  me.rx += (me.x - me.rx) * 0.5; me.ry += (me.y - me.ry) * 0.5;
  const camX = Math.round(me.rx - W / 2), camY = Math.round(me.ry - H / 2);
  ctx.save(); ctx.translate(-camX, -camY);
  ctx.drawImage(mapCache, 0, 0);

  // трассеры
  tracers = tracers.filter((t) => now - t.t < 140);
  for (const t of tracers) {
    const k = 1 - (now - t.t) / 140;
    ctx.strokeStyle = t.team === 0 ? `rgba(150,200,255,${k})` : `rgba(255,170,150,${k})`;
    ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(t.x1, t.y1); ctx.lineTo(t.x2, t.y2); ctx.stroke();
    if (t.hit) { ctx.fillStyle = `rgba(255,60,60,${k})`; ctx.beginPath(); ctx.arc(t.x2, t.y2, 5, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.fillStyle = `rgba(255,230,160,${k})`; ctx.fillRect(t.x2 - 2, t.y2 - 2, 4, 4); }
  }

  const plist = interpPlayers(now);
  for (const p of plist) {
    if (p.id === myId) continue;
    if (!p.alive) { ctx.fillStyle = TEAM_COL[p.team] + '55'; ctx.font = '18px system-ui'; ctx.textAlign = 'center'; ctx.fillText('✕', p.x, p.y + 6); continue; }
    drawPlayer(p, false);
  }
  if (me.alive) drawPlayer({ id: myId, team: me.team, x: me.rx, y: me.ry, a: aimAngle(), hp: me.hp }, true);
  ctx.restore();

  // вспышка урона
  if (hurtFlash > 0) { ctx.fillStyle = `rgba(255,0,0,${hurtFlash * 0.25})`; ctx.fillRect(0, 0, W, H); hurtFlash = Math.max(0, hurtFlash - 0.05); }

  drawHUD(now, plist);
}

function drawHUD(now, plist) {
  const m = last, info = me.info || {};
  // счёт и таймер
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(10,12,16,0.75)'; roundRect(W / 2 - 130, 10, 260, 50, 10); ctx.fill();
  ctx.font = 'bold 28px system-ui';
  ctx.fillStyle = TEAM_COL[0]; ctx.fillText(m.sc[0], W / 2 - 80, 46);
  ctx.fillStyle = TEAM_COL[1]; ctx.fillText(m.sc[1], W / 2 + 80, 46);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px system-ui'; ctx.fillText(m.st === 'play' ? fmtTime(m.tl) : '—', W / 2, 33);
  ctx.font = '11px system-ui'; ctx.fillStyle = '#9aa3b2'; ctx.fillText(MAPS[mapIndex].name + ' · до ' + C.SCORE_LIMIT, W / 2, 51);

  // hp и патроны
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(10,12,16,0.75)'; roundRect(16, H - 66, 210, 50, 10); ctx.fill();
  ctx.font = 'bold 26px system-ui'; ctx.fillStyle = me.hp > 30 ? '#fff' : '#ff6b6b';
  ctx.fillText('✚ ' + (me.alive ? me.hp : 0), 30, H - 32);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(10,12,16,0.75)'; roundRect(W - 226, H - 66, 210, 50, 10); ctx.fill();
  if (info.rl > 0) { ctx.font = 'bold 18px system-ui'; ctx.fillStyle = '#ffd166'; ctx.fillText('Перезарядка…', W - 32, H - 34); }
  else { ctx.font = 'bold 26px system-ui'; ctx.fillStyle = info.ammo > 5 ? '#fff' : '#ff6b6b'; ctx.fillText((info.ammo ?? 0) + ' / ' + C.MAG, W - 32, H - 32); }
  ctx.textAlign = 'left'; ctx.font = '11px system-ui'; ctx.fillStyle = '#6c7585'; ctx.fillText('ping ' + ping + ' ms', 16, H - 76);

  // килфид
  let y = 20;
  for (const f of feed) {
    const age = now - f.t; if (age > 6000) continue;
    ctx.globalAlpha = Math.min(1, (6000 - age) / 800);
    ctx.textAlign = 'right'; ctx.font = '13px system-ui';
    if (f.kill) {
      const k = f.kill, vw = ctx.measureText(k.vn).width;
      ctx.fillStyle = 'rgba(10,12,16,0.7)'; const kw = ctx.measureText(k.kn + '  ⌐╦  ' + k.vn).width; ctx.fillRect(W - 24 - kw, y - 14, kw + 12, 20);
      ctx.fillStyle = TEAM_COL[k.vt === 'A' ? 0 : 1]; ctx.fillText(k.vn, W - 18, y);
      ctx.fillStyle = '#ccc'; ctx.fillText('  ⌐╦  ', W - 18 - vw, y);
      const sw = ctx.measureText('  ⌐╦  ').width;
      ctx.fillStyle = TEAM_COL[k.kt === 'A' ? 0 : 1]; ctx.fillText(k.kn, W - 18 - vw - sw, y);
    } else { ctx.fillStyle = f.c; ctx.fillText(f.s, W - 18, y); }
    y += 24;
  }
  ctx.globalAlpha = 1;

  // +1 за килл
  floaters = floaters.filter((f) => now - f.t < 1200);
  for (const f of floaters) { const k = (now - f.t) / 1200; ctx.globalAlpha = 1 - k; ctx.textAlign = 'center'; ctx.font = 'bold 20px system-ui'; ctx.fillStyle = '#ffd166'; ctx.fillText(f.s, W / 2, H / 2 - 60 - k * 40); }
  ctx.globalAlpha = 1;

  drawMinimap(plist);

  // смерть
  if (!me.alive && m.st === 'play') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 32px system-ui'; ctx.fillText('Ты убит', W / 2, H / 2 - 10);
    ctx.font = '18px system-ui'; ctx.fillStyle = '#ccd'; ctx.fillText('Возрождение через ' + Math.ceil((info.ri || 0) / 1000) + ' с', W / 2, H / 2 + 22);
  }
  // конец матча
  if (m.st === 'end') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.font = 'bold 40px system-ui';
    if (m.w === 'D') { ctx.fillStyle = '#fff'; ctx.fillText('Ничья', W / 2, H / 2 - 120); }
    else { const t = m.w === 'A' ? 0 : 1; ctx.fillStyle = TEAM_COL[t]; ctx.fillText((t === me.team ? 'Победа! ' : 'Поражение. ') + TEAM_NAME[t] + ' выиграли', W / 2, H / 2 - 120); }
    ctx.font = '16px system-ui'; ctx.fillStyle = '#ccd';
    ctx.fillText('Следующая карта: ' + MAPS[(mapIndex + 1) % MAPS.length].name + ' через ' + Math.ceil(m.tl / 1000) + ' с', W / 2, H / 2 - 88);
    drawBoard(H / 2 - 60);
  } else if (showBoard) drawBoard(90);

  // прицел
  if (me.alive) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; const s = 8, gx = mouse.x, gy = mouse.y;
    ctx.beginPath(); ctx.moveTo(gx - s - 4, gy); ctx.lineTo(gx - 4, gy); ctx.moveTo(gx + 4, gy); ctx.lineTo(gx + s + 4, gy);
    ctx.moveTo(gx, gy - s - 4); ctx.lineTo(gx, gy - 4); ctx.moveTo(gx, gy + 4); ctx.lineTo(gx, gy + s + 4); ctx.stroke();
  }
}

function drawBoard(top) {
  const w = Math.min(640, W - 40), x0 = W / 2 - w / 2;
  const rows = [...roster.entries()].map(([id, r]) => ({ id, ...r }));
  ctx.fillStyle = 'rgba(12,14,19,0.92)'; roundRect(x0, top, w, 300, 12); ctx.fill();
  for (let t = 0; t < 2; t++) {
    const list = rows.filter((r) => r.team === t).sort((a, b) => b.kills - a.kills || a.deaths - b.deaths);
    const cx = x0 + (t === 0 ? 16 : w / 2 + 8), cw = w / 2 - 24;
    ctx.textAlign = 'left'; ctx.font = 'bold 16px system-ui'; ctx.fillStyle = TEAM_COL[t]; ctx.fillText(TEAM_NAME[t] + ' — ' + last.sc[t], cx, top + 30);
    ctx.font = '12px system-ui'; ctx.fillStyle = '#7d8696'; ctx.fillText('Игрок', cx, top + 54); ctx.textAlign = 'right'; ctx.fillText('У / С', cx + cw, top + 54);
    list.forEach((r, i) => {
      const yy = top + 80 + i * 40;
      if (r.id === myId) { ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(cx - 6, yy - 20, cw + 12, 30); }
      ctx.textAlign = 'left'; ctx.font = '14px system-ui'; ctx.fillStyle = r.bot ? '#8b93a3' : '#fff'; ctx.fillText(r.name, cx, yy);
      ctx.textAlign = 'right'; ctx.fillText(r.kills + ' / ' + r.deaths, cx + cw, yy);
    });
  }
}

function drawMinimap(plist) {
  const map = MAPS[mapIndex], s = 5, mw = map.W * s, mh = map.H * s, x0 = 16, y0 = H - 86 - mh;
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = 'rgba(10,12,16,0.8)'; ctx.fillRect(x0 - 4, y0 - 4, mw + 8, mh + 8);
  ctx.fillStyle = '#5a6170';
  for (let y = 0; y < map.H; y++) for (let x = 0; x < map.W; x++) if (map.grid[y * map.W + x]) ctx.fillRect(x0 + x * s, y0 + y * s, s, s);
  const k = s / C.TILE;
  for (const p of plist) {
    if (!p.alive || p.team !== me.team || p.id === myId) continue;
    ctx.fillStyle = TEAM_COL[p.team]; ctx.fillRect(x0 + p.x * k - 2, y0 + p.y * k - 2, 4, 4);
  }
  if (me.alive) { ctx.fillStyle = '#fff'; ctx.fillRect(x0 + me.rx * k - 3, y0 + me.ry * k - 3, 6, 6); }
  ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

requestAnimationFrame(frame);
})();
